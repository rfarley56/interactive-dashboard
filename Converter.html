<section>
  <h2>Metric Converter</h2>

  <select id="conversionChoice">
    <option value="1">Inch → Centimeter</option>
    <option value="2">Foot → Centimeter</option>
    <option value="3">Yard → Meter</option>
    <option value="4">Mile → Kilometer</option>
    <option value="5">Centimeter → Inch</option>
    <option value="6">Centimeter → Foot</option>
    <option value="7">Meter → Yard</option>
    <option value="8">Kilometer → Mile</option>
  </select>

  <input type="number" id="inputValue" placeholder="Enter a value">

  <button type="button" onclick="convert()">Convert</button>

  <p id="output"></p>
</section>
