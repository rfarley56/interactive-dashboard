<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task Manager | My Interactive Dashboard</title>
  <!-- Bootstrap 5 (remove if your dashboard already loads it) -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

  <div class="container py-4">

    <!-- ========================================================
         TASK MANAGER SECTION
         Copy everything from here to "END TASK MANAGER SECTION"
         into your dashboard's index.html where the old task
         manager lives.
         ======================================================== -->
    <section id="task-manager" class="card shadow-sm mb-4">
      <div class="card-header bg-dark text-white d-flex justify-content-between align-items-center flex-wrap gap-2">
        <h2 class="h5 mb-0">Task Manager</h2>
        <small id="task-summary" class="text-white-50">0 task(s)</small>
      </div>

      <div class="card-body">
        <!-- Add-task form -->
        <form id="task-form" class="row g-2 align-items-center" novalidate>
          <!-- Task name input -->
          <div class="col-12 col-md-5">
            <label for="task-name" class="visually-hidden">Task name</label>
            <input type="text" id="task-name" class="form-control"
                   placeholder="Enter a task..." maxlength="100" autocomplete="off">
          </div>

          <!-- Priority dropdown -->
          <div class="col-6 col-md-2">
            <label for="task-priority" class="visually-hidden">Priority</label>
            <select id="task-priority" class="form-select">
              <option value="High">High</option>
              <option value="Medium" selected>Medium</option>
              <option value="Low">Low</option>
            </select>
          </div>

          <!-- Important checkbox -->
          <div class="col-6 col-md-2">
            <div class="form-check mb-0">
              <input type="checkbox" id="task-important" class="form-check-input">
              <label for="task-important" class="form-check-label">Important</label>
            </div>
          </div>

          <!-- Submit + Delete List buttons -->
          <div class="col-12 col-md-3 d-flex gap-2">
            <button type="submit" id="add-task-btn" class="btn btn-primary flex-fill">Add Task</button>
            <button type="button" id="delete-list-btn" class="btn btn-outline-danger flex-fill">Delete List</button>
          </div>
        </form>

        <!-- Status message -->
        <p id="task-message" class="small mt-2 mb-3" aria-live="polite">&nbsp;</p>

        <!-- Legend -->
        <div class="d-flex flex-wrap gap-3 small text-muted mb-3">
          <span><span style="display:inline-block;width:12px;height:12px;background:#fd7e14;"></span> High</span>
          <span><span style="display:inline-block;width:12px;height:12px;background:#0d6efd;"></span> Medium</span>
          <span><span style="display:inline-block;width:12px;height:12px;background:#6c757d;"></span> Low</span>
          <span style="color:red;">Red = Important</span>
          <span style="text-decoration:line-through;">Strikethrough = Completed</span>
        </div>

        <!-- JavaScript builds the <ul> of tasks inside this div -->
        <div id="task-list"></div>
      </div>
    </section>
    <!-- ================= END TASK MANAGER SECTION ================= -->

  </div>

  <!-- Task Manager script (add this before </body> in index.html) -->
  <script src="js/task-manager.js"></script>
</body>
</html>
