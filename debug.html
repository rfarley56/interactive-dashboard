<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>RDFarley JavaScript Debugging Exercise</title>
</head>
<body>
    <h1>Dashboard Status</h1>
    <div id="display"></div>
 
    <script>
        // Weekly Goal: Calculate the total weekly task goal for a user.
        
        // Declare variables and values
        let userName = "Jane Doe";
        let dailyGoal = 5; 
        let bonusTasks = "2"; 
 
        // Output message to console
        console.log("Checking status for: " + userName); 
 
        // Calculate weekly goal based on number of workdays (5) per week
        // Renamed misspelled variable 'dailyGoal' to 'dailyGoal'
        // FIXED: Changed multiplier from 15 to 5 to reflect 5 workdays per week.
        let weeklyGoal = dailyGoal * 5; 
 
        // Add bonusTasks to weeklyGoal. 
        // Note: Check for data type issues
        // FIXED: Converted bonusTasks from a string to a number using Number() so it adds correctly.
        // FIXED: Changed the subtraction operator to addition so bonus tasks are added to the weekly goal.
        let totalGoal = weeklyGoal + Number(bonusTasks);
         
        // Output results to web page
        document.write("User: " + userName + "<br>");
        // FIXED: Moved totalGoal outside the string and concatenated it so the actual value displays.
        document.write("Total Weekly Goal: " + totalGoal);
 
    </script>
</body>
</html>
