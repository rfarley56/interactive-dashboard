<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Interactive Dashboard</title>
    <!-- Load Bootstrap FIRST -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script defer src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <!-- Load your custom CSS SECOND so it overrides Bootstrap -->
    <link rel="stylesheet" href="css/style.css">
    <!-- Styles for the Weekly Task Goal form -->
    <style>
      #weekly-tasks form {
        display: flex;
        flex-direction: column;
        max-width: 300px;
        gap: 0.75rem;
        margin: 1rem 0;
      }

      #weekly-tasks label {
        font-weight: bold;
      }

      #weekly-tasks input {
        padding: 0.4rem;
        border: 1px solid #ccc;
        border-radius: 4px;
      }

      #goal-btn {
        padding: 0.5rem 1rem;
        background-color: #2c7be5;
        color: white;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        width: fit-content;
      }

      #goal-btn:hover {
        background-color: #1a5bb8;
      }

      #goal-message {
        font-weight: bold;
      }

      #metric-converter {
        display: flex;
        flex-direction: column;
        max-width: 300px;
        gap: 0.75rem;
        margin: 1rem 0;
      }

      #metric-converter {
        display: flex;
        flex-direction: column;
        max-width: 300px;
        gap: 0.75rem;
        margin: 1rem 0;
      }

      #metric-converter label {
        font-weight: bold;
      }

      #metric-converter input,
      #metric-converter select {
        padding: 0.4rem;
        border: 1px solid #ccc;
        border-radius: 4px;
      }

      #metric-converter button {
        padding: 0.5rem 1rem;
        background-color: #2c7be5;
        color: white;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        width: fit-content;
      }

      #metric-converter button:hover {
        background-color: #1a5bb8;
      }

      #conversion-result {
        font-weight: bold;
      }
    </style>
  </head>
  <body>
    <h1>My Interactive Dashboard</h1>
    <p> This dashboard was created by Robyn Farley for the WEB-115 course at Wake Tech. </p>
    <script>
      document.write("This dashboard demonstrates how JavaScript can be used to create interactive websites.");
    </script>
    <!-- The <noscript> is for web browsers with JavaScript rendering disabled. -->
    <noscript> Unfortunately, your web browser does not support JavaScript. </noscript>
    <div class="container">
      <div class="row">
        <!-- Dashboard Content -->
        <div class="col" id="weekly-tasks">
          <script src="js/task-manager.js" defer></script>
          <form id="goal-form">
            <label for="user-name">Name:</label>
            <input type="text" id="user-name" name="user-name" required>
            <label for="daily-goal">Daily Task Goal:</label>
            <input type="number" id="daily-goal" name="daily-goal" required>
            <label for="bonus-tasks">Weekly Bonus Tasks:</label>
            <input type="number" id="bonus-tasks" name="bonus-tasks" required>
            <button type="submit" id="goal-btn">Calculate Weekly Goal</button>
          </form>
          <p id="goal-message"></p>
        </div>
        <div class="col" id="metric-converter">
          <script src="js/metric-converter.js" defer></script>
          <h2>Imperial/Metric Converter</h2>
          <form id="converter-form">
            <label for="input-value">Value:</label>
            <input type="number" id="input-value" name="input-value" required>
            <label for="conversion-type">Conversion:</label>
            <select id="conversion-type" name="conversion-type">
              <option value="1">Inch to Centimeter</option>
              <option value="2">Foot to Centimeter</option>
              <option value="3">Yard to Meter</option>
              <option value="4">Mile to Kilometer</option>
              <option value="5">Centimeter to Inch</option>
              <option value="6">Centimeter to Foot</option>
              <option value="7">Meter to Yard</option>
              <option value="8">Kilometer to Mile</option>
            </select>
            <button type="submit" id="convert-btn">Convert</button>
          </form>
          <div id="conversion-result"></div>
        </div>
      </div>
    </div>
  </body>
</html>
